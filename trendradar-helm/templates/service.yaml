apiVersion: v1
kind: Service
metadata:
  name: {{ include "trendradar.fullname" . }}
  labels:
    {{- include "trendradar.labels" . | nindent 4 }}
spec:
  type: {{ .Values.appService.type }}
  ports:
    - port: {{ .Values.appService.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if eq .Values.appService.type "NodePort" }}
      nodePort: {{ .Values.appService.nodePort }}
      {{- end }}
  selector:
    {{- include "trendradar.selectorLabels" . | nindent 4 }}
---
{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trendradar.fullname" . }}-mcp
  labels:
    {{- include "trendradar.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.mcpService.type }}
  ports:
    - port: {{ .Values.mcpService.port }}
      targetPort: mcp
      protocol: TCP
      name: mcp
      {{- if eq .Values.mcpService.type "NodePort" }}
      nodePort: {{ .Values.mcpService.nodePort }}
      {{- end }}
  selector:
    {{- include "trendradar.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
{{- end }}
